<title>Part 1 and Part 3 Questions</title>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--text:#182339;--muted:#738097;--line:#e4eaf2;--blue:#315eea;--r:19px}
*{box-sizing:border-box}html{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}button,select,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #adc0ff;outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:36px 22px 64px}
.home{color:var(--blue);font-size:13px;font-weight:700;text-decoration:none}.home:hover{text-decoration:underline}
.eyebrow{margin:18px 0 8px;color:var(--blue);font-size:11px;letter-spacing:.15em;font-weight:800}
h1{margin:0;font-size:clamp(28px,4vw,36px);letter-spacing:-.04em;line-height:1.15}
.sub{margin:10px 0 0;max-width:42em;color:var(--muted);font-size:14px;line-height:1.6}
.panel{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 9px 36px rgba(35,49,79,.035);padding:22px}
.switch{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.switch button{border:1px solid #d8e1f0;background:#fff;color:#455874;border-radius:999px;min-height:36px;padding:0 14px;font-size:13px;font-weight:750}
.switch button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.settings{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.setting{display:flex;flex-direction:column;gap:6px;min-width:0;color:#39465d;font-size:12px;font-weight:750}
.setting select,.setting input{width:100%;max-width:100%;height:42px;border:1px solid #d6deeb;border-radius:12px;background:#fff;padding:0 12px;color:var(--text)}
.line{display:flex;flex-wrap:nowrap;gap:8px;align-items:flex-end;max-width:100%}
.topic{width:16rem;max-width:100%}
.line .voice{flex:0 1 10rem;width:10rem;max-width:10rem}
.line .speed{flex:0 0 4.5rem;width:4.5rem}
.line .count{flex:0 0 3.75rem;width:3.75rem}
.line select,.line input{padding:0 6px}
.transport{display:flex;gap:6px;margin-top:14px}
.symbol{width:42px;height:42px;border:1px solid #d8e1f0;border-radius:12px;background:#fff;color:var(--blue);display:inline-flex;align-items:center;justify-content:center;padding:0}
.symbol svg{width:16px;height:16px;display:block;fill:currentColor}
.symbol[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.questions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.q{display:flex;gap:4px;align-items:flex-start;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 4px 4px 12px;color:inherit}
.q.on{border-color:#b9cbff;box-shadow:0 0 0 3px #315eea18}
.q-main{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-start;border:0;background:transparent;padding:8px 0;text-align:left;color:inherit}
.num{flex:none;width:1.4em;color:var(--muted);font-size:13px;font-weight:750;font-variant-numeric:tabular-nums;text-align:right}
.q-text{line-height:1.45}
.copy{flex:none;width:36px;height:36px;margin-top:2px;border:0;border-radius:10px;background:transparent;color:#8b97ab;display:inline-flex;align-items:center;justify-content:center;padding:0}
.copy svg{width:16px;height:16px;display:block;fill:currentColor}
.copy:hover,.copy.done{color:var(--blue);background:#eef3ff}
.note{margin:12px 0 0;min-height:1.4em;color:var(--muted);font-size:13px;line-height:1.55}
@media(max-width:700px){.wrap{padding:22px 14px 40px}.panel{padding:16px}}

<body>
<div class="wrap">
 <a class="home" href="index.html">← Home</a>
 <div class="eyebrow">IELTS SPEAKING</div>
 <h1>Part 1 and Part 3</h1>
 <p class="sub">Choose a topic. Each question is read the number of times you set, with the gap you set between readings.</p>
 <section class="panel" aria-label="Question reading">
  <div class="switch" role="group" aria-label="Part">
   <button type="button" data-part="1" aria-pressed="true">Part 1</button>
   <button type="button" data-part="3" aria-pressed="false">Part 3</button>
  </div>
  <div class="switch" role="group" aria-label="Question bank">
   <button type="button" data-bank="basic" aria-pressed="true">Basic</button>
   <button type="button" data-bank="extended" aria-pressed="false">Extended</button>
  </div>
  <div class="settings">
   <label class="setting topic"><span>Topic</span><select id="topic" aria-label="Topic"></select></label>
   <div class="line">
    <label class="setting voice"><span>Voice</span><select id="voice" aria-label="Voice"></select></label>
    <label class="setting speed"><span>Speed</span><select id="speed" aria-label="Speed"><option value="0.85">0.85×</option><option value="1" selected>1.0×</option><option value="1.12">1.12×</option></select></label>
    <label class="setting count"><span>Times</span><input id="times" type="number" min="1" max="10" step="1" value="2" inputmode="numeric" aria-label="Times to read each question"></label>
    <label class="setting count"><span>Gaps</span><input id="gap" type="number" min="0" max="60" step="1" value="3" inputmode="numeric" aria-label="Gaps in seconds"></label>
   </div>
  </div>
  <div class="transport">
   <button type="button" id="play" class="symbol" aria-label="Play"></button>
   <button type="button" id="stop" class="symbol" aria-label="Stop" disabled></button>
  </div>
  <div id="questions" class="questions"></div>
  <p id="status" class="note" role="status"></p>
 </section>
</div>
<script src="speaking-questions.js"></script>
<script>
(()=>{'use strict';
const el=id=>document.getElementById(id);
const PART_KEY='ielts-question-read-part';
const BANK_KEY='ielts-question-read-bank';
const TOPIC_KEY='ielts-question-read-topic';
const TIMES_KEY='ielts-question-read-times';
const GAP_KEY='ielts-question-read-gap';
const VOICE_KEY='ielts-question-read-voice';
const SPEED_KEY='ielts-question-read-speed';
const QUESTION_KEY='ielts-question-read-question';
const speechOK=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
const ICONS={play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zm8 0h4v14h-4z',stop:'M6 6h12v12H6z',copy:'M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z'};
function icon(name){
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 24 24');
 svg.setAttribute('aria-hidden','true');
 const path=document.createElementNS('http://www.w3.org/2000/svg','path');
 path.setAttribute('d',ICONS[name]);
 svg.append(path);
 return svg;
}
let part=1;
let bank='basic';
let active=-1;
let place=0;
let pass=0;
let passes=1;
let paused=false;
let token=0;
let keepAlive=0;
function stored(key,fallback){
 try{const value=localStorage.getItem(key);if(value!=null&&value!=='')return value}catch(_){}
 return fallback;
}
function save(key,value){try{localStorage.setItem(key,value)}catch(_){}}
function topicNames(){
 if(part===1)return bank==='extended'?window.IELTS_PART1_EXTENDED:window.IELTS_PART1_BASIC;
 const extended=new Set(window.IELTS_PART23_EXTENDED);
 const names=Object.keys(window.IELTS_PART23);
 return bank==='extended'?window.IELTS_PART23_EXTENDED.filter(name=>names.includes(name)):names.filter(name=>!extended.has(name));
}
function questionTexts(){
 const name=el('topic').value;
 if(part===1)return (window.IELTS_PART1[name]||[]).map(item=>item.q);
 return (window.IELTS_PART23[name]||[]).filter(item=>item.part===3).map(item=>item.q);
}
function times(){
 const value=Math.round(Number(el('times').value));
 return Math.min(10,Math.max(1,Number.isFinite(value)?value:1));
}
function gapMs(){
 const value=Math.round(Number(el('gap').value));
 return Math.min(60,Math.max(0,Number.isFinite(value)?value:0))*1000;
}
function mechanical(voice){
 const name=voice&&voice.name||'';
 return /microsoft/i.test(name)&&!/natural|online/i.test(name);
}
function voices(){
 if(!speechOK)return [];
 return window.speechSynthesis.getVoices().filter(voice=>/^en([-_]|$)/i.test(voice.lang)&&!mechanical(voice)).sort((a,b)=>(/^en-GB/i.test(a.lang)?0:/^en-CA/i.test(a.lang)?1:2)-( /^en-GB/i.test(b.lang)?0:/^en-CA/i.test(b.lang)?1:2)||a.name.localeCompare(b.name));
}
function fillVoices(){
 const select=el('voice');
 const previous=select.value||stored(VOICE_KEY,'');
 const list=voices();
 select.replaceChildren();
 if(!list.length){
  const option=document.createElement('option');
  option.value='';
  option.textContent=speechOK?'English voice loading':'Speech unavailable';
  select.append(option);
  select.disabled=true;
  return;
 }
 select.disabled=false;
 list.forEach(voice=>{
  const option=document.createElement('option');
  option.value=voice.voiceURI;
  option.textContent=voice.name;
  select.append(option);
 });
 select.value=[...select.options].some(option=>option.value===previous)?previous:(list.find(voice=>/^en-GB/i.test(voice.lang))||list[0]).voiceURI;
}
function chosenVoice(){
 return voices().find(voice=>voice.voiceURI===el('voice').value)||null;
}
function paintParts(){
 document.querySelectorAll('[data-part]').forEach(button=>button.setAttribute('aria-pressed',Number(button.dataset.part)===part?'true':'false'));
 document.querySelectorAll('[data-bank]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.bank===bank?'true':'false'));
}
function fillTopics(){
 const select=el('topic');
 const previous=select.value||stored(TOPIC_KEY,'');
 const names=topicNames();
 select.replaceChildren();
 names.forEach(name=>{
  const option=document.createElement('option');
  option.value=name;
  option.textContent=name;
  select.append(option);
 });
 select.value=names.includes(previous)?previous:(names[0]||'');
}
function renderQuestions(){
 const host=el('questions');
 const list=questionTexts();
 const numbered=list.length>1;
 host.replaceChildren();
 list.forEach((text,index)=>{
  const row=document.createElement('div');
  row.className='q';
  const main=document.createElement('button');
  main.type='button';
  main.className='q-main';
  main.addEventListener('click',()=>play(index));
  if(numbered){
   const num=document.createElement('span');
   num.className='num';
   num.textContent=String(index+1);
   main.append(num);
  }
  const body=document.createElement('span');
  body.className='q-text';
  body.textContent=text;
  main.append(body);
  const copy=document.createElement('button');
  copy.type='button';
  copy.className='copy';
  copy.setAttribute('aria-label','Copy question');
  copy.append(icon('copy'));
  copy.addEventListener('click',()=>copyQuestion(text,copy));
  row.append(main,copy);
  host.append(row);
 });
 paint();
}
function copyQuestion(text,button){
 const done=()=>{
  button.classList.add('done');
  button.setAttribute('aria-label','Copied');
  setTimeout(()=>{button.classList.remove('done');button.setAttribute('aria-label','Copy question')},1200);
 };
 const fallback=()=>{
  const area=document.createElement('textarea');
  area.value=text;
  area.setAttribute('readonly','');
  area.style.position='fixed';
  area.style.left='-999px';
  document.body.append(area);
  area.select();
  let ok=false;
  try{ok=document.execCommand('copy')}catch(_){}
  area.remove();
  if(ok)done();
 };
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fallback);
 else fallback();
}
function toggle(){
 if(active>=0&&!paused)pause();
 else play();
}
function nextTopicName(){
 const names=topicNames();
 const index=names.indexOf(el('topic').value);
 return index<0?'':names[index+1]||'';
}
function remember(index){
 place=index;
 save(QUESTION_KEY,String(index));
}
function paint(){
 const mark=active>=0?active:place;
 document.querySelectorAll('#questions .q').forEach((row,index)=>row.classList.toggle('on',index===mark));
 const playing=active>=0&&!paused;
 const path=el('play').querySelector('path');
 if(path)path.setAttribute('d',ICONS[playing?'pause':'play']);
 el('play').setAttribute('aria-label',playing?'Pause':'Play');
 el('play').setAttribute('aria-pressed',playing?'true':'false');
 el('stop').disabled=active<0;
 const row=document.querySelectorAll('#questions .q')[mark];
 if(row)row.scrollIntoView({block:'nearest'});
}
function halt(){
 token++;
 clearInterval(keepAlive);
 if(speechOK){try{window.speechSynthesis.cancel()}catch(_){}}
}
function stop(){
 halt();
 active=-1;
 pass=0;
 paused=false;
 el('status').textContent='';
 paint();
}
function pause(){
 if(active<0||paused||!speechOK)return;
 paused=true;
 try{window.speechSynthesis.pause()}catch(_){}
 paint();
}
function waitGap(ms,run){
 return new Promise(resolve=>{
  if(ms<=0){resolve(run===token);return}
  let left=ms;
  let mark=Date.now();
  const tick=()=>{
   if(run!==token){resolve(false);return}
   if(!paused){
    const now=Date.now();
    left-=now-mark;
    mark=now;
    if(left<=0){resolve(true);return}
   }else mark=Date.now();
   setTimeout(tick,Math.min(200,Math.max(30,left)));
  };
  tick();
 });
}
function play(from){
 if(!speechOK){el('status').textContent='This browser cannot read aloud.';return}
 if(active>=0&&paused&&!Number.isInteger(from)){
  paused=false;
  try{window.speechSynthesis.resume()}catch(_){}
  paint();
  return;
 }
 if(active>=0&&!paused&&!Number.isInteger(from))return;
 const start=Number.isInteger(from)?from:Math.max(0,place);
 let count=times();
 const queue=(fromIndex)=>{
  const list=questionTexts();
  const items=[];
  for(let index=fromIndex;index<list.length;index++){
   for(let round=1;round<=count;round++)items.push({index,round,text:list[index]});
  }
  return items;
 };
 let plan=queue(start);
 if(!plan.length)return;
 const was=speechOK&&(window.speechSynthesis.speaking||window.speechSynthesis.pending||paused);
 halt();
 const run=token;
 paused=false;
 passes=count;
 let cursor=0;
 const step=()=>{
  if(run!==token)return;
  if(cursor>=plan.length){
   const next=nextTopicName();
   if(!next){active=-1;pass=0;paused=false;clearInterval(keepAlive);el('status').textContent='';paint();return}
   el('topic').value=next;
   save(TOPIC_KEY,next);
   count=times();
   passes=count;
   plan=queue(0);
   cursor=0;
   active=-1;
   if(!plan.length){pass=0;paused=false;clearInterval(keepAlive);el('status').textContent='';paint();return}
   renderQuestions();
   step();
   return;
  }
  const item=plan[cursor++];
  active=item.index;
  remember(item.index);
  pass=item.round;
  el('status').textContent=count>1?item.round+' of '+count:'';
  paint();
  const utterance=new SpeechSynthesisUtterance(item.text);
  utterance.pitch=1;
  utterance.rate=Math.max(.5,Math.min(1.6,Number(el('speed').value)||1));
  const voice=chosenVoice();
  if(voice){utterance.voice=voice;utterance.lang=voice.lang||'en-GB'}
  else utterance.lang='en-GB';
  const done=()=>{
   if(run!==token)return;
   waitGap(cursor<plan.length||nextTopicName()?gapMs():0,run).then(ok=>{if(ok)step()});
  };
  utterance.onend=done;
  utterance.onerror=done;
  window.speechSynthesis.speak(utterance);
 };
 if(was)setTimeout(step,70);else step();
 keepAlive=setInterval(()=>{
  if(run!==token){clearInterval(keepAlive);return}
  if(paused)return;
  if(window.speechSynthesis.speaking)window.speechSynthesis.resume();
 },4000);
}
function show(){
 place=0;
 save(QUESTION_KEY,'0');
 stop();
 paintParts();
 fillTopics();
 renderQuestions();
 save(PART_KEY,String(part));
 save(BANK_KEY,bank);
 save(TOPIC_KEY,el('topic').value);
}
el('play').append(icon('play'));
el('stop').append(icon('stop'));
document.querySelectorAll('[data-part]').forEach(button=>button.addEventListener('click',()=>{
 const next=Number(button.dataset.part);
 if(next===part)return;
 part=next;
 show();
}));
document.querySelectorAll('[data-bank]').forEach(button=>button.addEventListener('click',()=>{
 if(button.dataset.bank===bank)return;
 bank=button.dataset.bank;
 show();
}));
el('topic').addEventListener('change',()=>{save(TOPIC_KEY,el('topic').value);place=0;save(QUESTION_KEY,'0');stop();renderQuestions()});
el('times').addEventListener('change',()=>{el('times').value=String(times());save(TIMES_KEY,el('times').value)});
el('gap').addEventListener('change',()=>{el('gap').value=String(gapMs()/1000);save(GAP_KEY,el('gap').value)});
el('play').addEventListener('click',toggle);
el('stop').addEventListener('click',stop);
document.addEventListener('keydown',event=>{
 if(event.key!==' '&&event.code!=='Space')return;
 if(event.repeat||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
 if(event.target&&event.target.closest&&event.target.closest('input,select,textarea'))return;
 event.preventDefault();
 toggle();
},true);
el('voice').addEventListener('change',()=>save(VOICE_KEY,el('voice').value));
el('speed').addEventListener('change',()=>save(SPEED_KEY,el('speed').value));
part=stored(PART_KEY,'1')==='3'?3:1;
bank=stored(BANK_KEY,'basic')==='extended'?'extended':'basic';
el('times').value=stored(TIMES_KEY,'2');
el('gap').value=stored(GAP_KEY,'3');
el('times').value=String(times());
el('gap').value=String(gapMs()/1000);
try{const speed=stored(SPEED_KEY,'');if(speed&&el('speed').querySelector('option[value="'+speed+'"]'))el('speed').value=speed}catch(_){}
fillVoices();
if(speechOK)window.speechSynthesis.addEventListener('voiceschanged',fillVoices);
paintParts();
fillTopics();
if(topicNames().includes(stored(TOPIC_KEY,'')))el('topic').value=stored(TOPIC_KEY,'');
const savedQuestion=Math.round(Number(stored(QUESTION_KEY,'0')));
place=Number.isFinite(savedQuestion)&&savedQuestion>=0?savedQuestion:0;
if(place>=questionTexts().length)place=0;
renderQuestions();
})();
</script>
</body>
</html>
